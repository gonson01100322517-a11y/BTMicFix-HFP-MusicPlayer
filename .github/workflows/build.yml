name: Build HFP Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          unzip -q BTMicFix-HFP-MusicPlayer.zip -d extracted
          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch HFP routing
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          manifest = root / "app/src/main/AndroidManifest.xml"
          s = manifest.read_text()
          if "android.permission.BLUETOOTH_SCAN" not in s:
              needle = '    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />'
              s = s.replace(needle, needle + '\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />')
          manifest.write_text(s)

          setup = root / "app/src/main/java/com/btmicfix/ui/screens/SetupScreen.kt"
          s = setup.read_text()
          old_launcher = '''    val btPermissionLauncher = rememberLauncherForActivityResult(
        ActivityResultContracts.RequestPermission()
    ) { granted ->
        bluetoothPermissionGranted = granted
    }'''
          new_launcher = '''    val btPermissionLauncher = rememberLauncherForActivityResult(
        ActivityResultContracts.RequestMultiplePermissions()
    ) { result ->
        bluetoothPermissionGranted =
            result[Manifest.permission.BLUETOOTH_CONNECT] == true &&
            result[Manifest.permission.BLUETOOTH_SCAN] == true
    }'''
          s = s.replace(old_launcher, new_launcher)
          s = s.replace(
              'btPermissionLauncher.launch(Manifest.permission.BLUETOOTH_CONNECT)',
              'btPermissionLauncher.launch(arrayOf(Manifest.permission.BLUETOOTH_CONNECT, Manifest.permission.BLUETOOTH_SCAN))'
          )
          old_check = '''context.checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) ==
                android.content.pm.PackageManager.PERMISSION_GRANTED'''
          new_check = '''context.checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) ==
                android.content.pm.PackageManager.PERMISSION_GRANTED &&
              context.checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) ==
                android.content.pm.PackageManager.PERMISSION_GRANTED'''
          s = s.replace(old_check, new_check)
          setup.write_text(s)

          audio = root / "app/src/main/java/com/btmicfix/audio/AudioRoutingManager.kt"
          s = audio.read_text()

          if "import android.os.Handler" not in s:
              s = s.replace(
                  "import android.media.AudioManager\n",
                  "import android.media.AudioManager\nimport android.os.Handler\nimport android.os.Looper\n"
              )

          start = s.index("    private fun refreshAvailableDevices() {")
          end = s.index("\n    companion object", start)
          new_refresh = '''    private fun refreshAvailableDevices() {
        val outputDevices = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
        val commDevices = audioManager.availableCommunicationDevices

        val btDevices = (outputDevices.asList() + commDevices.asList())
            .distinctBy { it.id }
            .filter { device ->
                device.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                device.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                device.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                device.type == AudioDeviceInfo.TYPE_BLE_SPEAKER
            }
            .map { device ->
                BluetoothAudioDevice(
                    deviceInfo = device,
                    name = device.productName?.toString() ?: "Bluetooth Device",
                    type = device.type,
                    typeLabel = deviceTypeToString(device.type),
                )
            }

        _availableDevices.value = btDevices
        Logger.d("Available BT devices: \${btDevices.map { "\${it.name} (\${it.typeLabel})" }}")
    }
'''
          s = s[:start] + new_refresh + s[end:]

          marker = '''            // This is the magic call — it forces the system to select this device
            // for communication audio, which triggers the SCO/HFP profile switch.
            val success = audioManager.setCommunicationDevice(device)
'''
          replacement = '''            // If Android exposes the connected device as A2DP first,
            // explicitly request the legacy SCO/HFP communication path.
            if (device.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) {
                Logger.i("A2DP device selected; requesting Bluetooth SCO/HFP")
                @Suppress("DEPRECATION")
                audioManager.startBluetoothSco()

                Handler(Looper.getMainLooper()).postDelayed({
                    try {
                        val sco = audioManager.availableCommunicationDevices.firstOrNull {
                            it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                            it.type == AudioDeviceInfo.TYPE_BLE_HEADSET
                        }
                        if (sco != null && audioManager.setCommunicationDevice(sco)) {
                            currentRoutedDevice = sco
                            _routingState.value = RoutingState.Active(deviceName)
                            Logger.i("✓ HFP/SCO routing active: $deviceName")
                        } else {
                            _routingState.value = RoutingState.Failed(
                                "Bluetooth HFP/SCO device did not become available"
                            )
                            Logger.w("No Bluetooth SCO device appeared after requesting SCO")
                        }
                    } catch (e: Exception) {
                        _routingState.value = RoutingState.Failed(
                            e.message ?: "Unknown HFP error"
                        )
                        Logger.e("✗ Exception while activating HFP/SCO", e)
                    }
                }, 1500L)

                return RoutingState.Routing(deviceName)
            }

            // Devices already exposed for communication can be selected directly.
            val success = audioManager.setCommunicationDevice(device)
'''
          if marker in s:
              s = s.replace(marker, replacement)
          audio.write_text(s)
          print("HFP patch applied")
          PY

      - name: Validate patched source
        shell: bash
        run: |
          set -e
          grep -n "BLUETOOTH_" "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          grep -n "getDevices\|availableCommunicationDevices\|startBluetoothSco\|setCommunicationDevice" "$PROJECT_DIR/app/src/main/java/com/btmicfix/audio/AudioRoutingManager.kt"

      - name: Build APK
        working-directory: \${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e
          gradle --no-daemon --stacktrace assembleDebug

      - name: Locate APK
        shell: bash
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app" -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/HFP-MusicPlayer.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HFP-MusicPlayer-APK
          path: HFP-MusicPlayer.apk
          if-no-files-found: error
