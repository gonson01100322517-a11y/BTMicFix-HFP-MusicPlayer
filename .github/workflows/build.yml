name: Build HFP Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q BTMicFix-HFP-MusicPlayer.zip -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Bluetooth HFP support
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          # Android 12+: allow access to connected/paired Bluetooth devices.
          manifest = root / "app/src/main/AndroidManifest.xml"
          s = manifest.read_text()
          if 'android.permission.BLUETOOTH_SCAN' not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />',
                  '<uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\\n'
                  '    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />'
              )
          manifest.write_text(s)

          # The original app only queried availableCommunicationDevices.
          # On many phones a connected speaker/headset initially appears as A2DP,
          # so it was being hidden from the UI. Show connected Bluetooth outputs too,
          # then request SCO/HFP when the user selects an A2DP device.
          audio = root / "app/src/main/java/com/btmicfix/audio/AudioRoutingManager.kt"
          a = audio.read_text()

          if 'import android.os.Handler' not in a:
              a = a.replace(
                  'import android.media.AudioManager\\n',
                  'import android.media.AudioManager\\nimport android.os.Handler\\nimport android.os.Looper\\n'
              )

          old_refresh = '''        val commDevices = audioManager.availableCommunicationDevices
          val btDevices = commDevices
              .filter { device ->
                  device.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                  device.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                  device.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP
              }
              .map { device ->
                  BluetoothAudioDevice(
                      deviceInfo = device,
                      name = device.productName?.toString() ?: "Unknown BT Device",
                      type = device.type,
                      typeLabel = deviceTypeToString(device.type),
                  )
              }
'''
          new_refresh = '''        val outputDevices = audioManager.getDevices(AudioManager.GET_DEVICES_OUTPUTS)
          val commDevices = audioManager.availableCommunicationDevices
          val btDevices = (outputDevices.asList() + commDevices)
              .distinctBy { it.id }
              .filter { device ->
                  device.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                  device.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                  device.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                  device.type == AudioDeviceInfo.TYPE_BLE_SPEAKER
              }
              .map { device ->
                  BluetoothAudioDevice(
                      deviceInfo = device,
                      name = device.productName?.toString() ?: "Bluetooth Device",
                      type = device.type,
                      typeLabel = deviceTypeToString(device.type),
                  )
              }
'''
          if old_refresh in a:
              a = a.replace(old_refresh, new_refresh)

          old_route = '''            // This is the magic call — it forces the system to select this device
              // for communication audio, which triggers the SCO/HFP profile switch.
              val success = audioManager.setCommunicationDevice(device)

              if (success) {
'''
          new_route = '''            // A connected device may initially be exposed only as A2DP.
              // Ask Android to bring up the Bluetooth SCO/HFP communication path first.
              if (device.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP) {
                  Logger.i("A2DP device selected; requesting Bluetooth SCO/HFP")
                  @Suppress("DEPRECATION")
                  audioManager.startBluetoothSco()

                  Handler(Looper.getMainLooper()).postDelayed({
                      try {
                          val sco = audioManager.availableCommunicationDevices.firstOrNull {
                              it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                              it.type == AudioDeviceInfo.TYPE_BLE_HEADSET
                          }
                          if (sco != null) {
                              val ok = audioManager.setCommunicationDevice(sco)
                              if (ok) {
                                  currentRoutedDevice = sco
                                  _routingState.value = RoutingState.Active(deviceName)
                                  Logger.i("✓ HFP/SCO routing active: $deviceName")
                              } else {
                                  _routingState.value = RoutingState.Failed("Android could not select the Bluetooth HFP device")
                                  Logger.e("✗ setCommunicationDevice failed after SCO request")
                              }
                          } else {
                              _routingState.value = RoutingState.Failed("Bluetooth HFP/SCO device did not become available")
                              Logger.w("No Bluetooth SCO device appeared after requesting SCO")
                          }
                      } catch (e: Exception) {
                          _routingState.value = RoutingState.Failed(e.message ?: "Unknown HFP error")
                          Logger.e("✗ Exception while activating HFP/SCO", e)
                      }
                  }, 1500L)

                  return RoutingState.Routing(deviceName)
              }

              // For devices already exposed as a communication device, select it directly.
              val success = audioManager.setCommunicationDevice(device)

              if (success) {
'''
          if old_route in a:
              a = a.replace(old_route, new_route)

          audio.write_text(a)

          # Keep the earlier compile fix.
          main = root / "app/src/main/java/com/btmicfix/MainActivity.kt"
          m = main.read_text()
          m = m.replace('                            hfpMusicPlayer = hfpMusicPlayer,\\n', '')
          main.write_text(m)

          print("=== Manifest Bluetooth permissions ===")
          for line in manifest.read_text().splitlines():
              if "BLUETOOTH_" in line:
                  print(line)
          print("=== Audio manager Bluetooth logic patched ===")
          print("=== MainActivity compile fix retained ===")
          PY
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Locate APK
        run: |
          APK=$(find "$PROJECT_DIR/app/build_tmp" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            find "$PROJECT_DIR/app/build_tmp" -type f | head -n 100
            exit 1
          fi
          echo "APK found: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/HFP-MusicPlayer.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HFP-MusicPlayer-APK
          path: HFP-MusicPlayer.apk
          if-no-files-found: error
