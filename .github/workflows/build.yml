name: Build HFP Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p extracted
          unzip -q BTMicFix-HFP-MusicPlayer.zip -d extracted
          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Inspect scanner source
        run: |
          set -e
          echo '--- BLUETOOTH/CDM MATCHES ---'
          grep -RniE 'CompanionDeviceManager|AssociationRequest|Choose a device to be managed|BLUETOOTH_SCAN|startDiscovery|BluetoothAdapter' "$PROJECT_DIR/app/src/main" || true
          echo '--- SETUP SCREEN ---'
          echo '--- KOTLIN COMPANION MANAGER ---'
          FILE="$PROJECT_DIR/app/src/main/java/com/btmicfix/companion/DeviceCompanionManager.kt"
          if [ -f "$FILE" ]; then nl -ba "$FILE" | sed -n '1,240p'; fi
          echo '--- SETUP SCREEN CANDIDATES ---'
          find "$PROJECT_DIR/app/src/main" -type f \( -name '*Setup*Screen*.kt' -o -name '*Setup*.kt' \) -print -exec sh -c 'echo "--- $1 ---"; nl -ba "$1" | sed -n "1,360p"' _ {} \;

      - name: Final Bluetooth scanner + HFP patch
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re, os

          root = Path(os.environ["PROJECT_DIR"])
          manifest = root / "app/src/main/AndroidManifest.xml"
          ms = manifest.read_text()

          def add_perm(line):
              global ms
              if line not in ms:
                  ms = ms.replace("<application", line + "\n\n    <application", 1)

          add_perm('    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />')
          add_perm('    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />')
          if 'android:name="android.permission.BLUETOOTH"' not in ms:
              add_perm('    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />')
          if 'android:name="android.permission.BLUETOOTH_ADMIN"' not in ms:
              add_perm('    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />')
          manifest.write_text(ms)

          setup = root / "app/src/main/java/com/btmicfix/ui/screens/SetupScreen.kt"
          text = setup.read_text()

          imports = [
              "import android.bluetooth.BluetoothAdapter",
              "import android.bluetooth.BluetoothDevice",
              "import android.bluetooth.BluetoothManager",
              "import android.content.BroadcastReceiver",
              "import android.content.IntentFilter",
              "import androidx.core.content.ContextCompat",
          ]
          anchor = "import android.Manifest\n"
          for imp in imports:
              if imp not in text:
                  text = text.replace(anchor, anchor + imp + "\n", 1)

          p0 = text.index("    // Bluetooth permission state")
          p1 = text.index("    // Notification permission state", p0)
          text = text[:p0] + new_perm + "\n\n" + text[p1:]

          new_launcher = '''    val btPermissionLauncher = rememberLauncherForActivityResult(
              ActivityResultContracts.RequestMultiplePermissions()
          ) { result ->
              val connectOk = Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                  result[Manifest.permission.BLUETOOTH_CONNECT] == true ||
                  context.checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) ==
                      android.content.pm.PackageManager.PERMISSION_GRANTED
              val scanOk = Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                  result[Manifest.permission.BLUETOOTH_SCAN] == true ||
                  context.checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN) ==
                      android.content.pm.PackageManager.PERMISSION_GRANTED
              bluetoothPermissionGranted = connectOk && scanOk
          }'''
          p0 = text.index("    val btPermissionLauncher = rememberLauncherForActivityResult")
          p1 = text.index("    val notifPermissionLauncher = rememberLauncherForActivityResult", p0)
          text = text[:p0] + new_launcher + "\n\n" + text[p1:]

          text = text.replace(
              'btPermissionLauncher.launch(Manifest.permission.BLUETOOTH_CONNECT)',
              '''btPermissionLauncher.launch(
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              arrayOf(
                                  Manifest.permission.BLUETOOTH_SCAN,
                                  Manifest.permission.BLUETOOTH_CONNECT
                              )
                          } else {
                              arrayOf(Manifest.permission.BLUETOOTH)
                          }
                      )''',
              1
          )

          start_marker = "            // Step 4: Pair Earbuds via CDM"
          end_marker = "            // Step 5: Test Routing"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = r'''            // Step 4: Direct Bluetooth Classic scanner.
            // This intentionally does NOT use CompanionDeviceManager.
            val bluetoothManager = remember(context) {
                context.getSystemService(BluetoothManager::class.java)
            }
            val bluetoothAdapter = bluetoothManager?.adapter
            var discoveredDevices by remember { mutableStateOf<List<BluetoothDevice>>(emptyList()) }
            var isScanning by remember { mutableStateOf(false) }
            var selectedDeviceName by remember { mutableStateOf<String?>(null) }

            fun refreshBluetoothDevices() {
                val adapter = bluetoothAdapter ?: return
                if (!bluetoothPermissionGranted) return
                try {
                    discoveredDevices = adapter.bondedDevices.toList()
                        .sortedBy { it.name ?: "" }
                } catch (_: SecurityException) {
                    discoveredDevices = emptyList()
                }
            }

            DisposableEffect(bluetoothAdapter, bluetoothPermissionGranted) {
                if (bluetoothAdapter == null || !bluetoothPermissionGranted) {
                    onDispose { }
                } else {
                    val receiver = object : BroadcastReceiver() {
                        override fun onReceive(ctx: Context?, intent: Intent?) {
                            when (intent?.action) {
                                BluetoothDevice.ACTION_FOUND -> {
                                    @Suppress("DEPRECATION")
                                    val device = intent.getParcelableExtra<BluetoothDevice>(
                                        BluetoothDevice.EXTRA_DEVICE
                                    )
                                    if (device != null) {
                                        discoveredDevices =
                                            (discoveredDevices + device)
                                                .distinctBy { it.address }
                                                .sortedBy { it.name ?: "" }
                                    }
                                }
                                BluetoothAdapter.ACTION_DISCOVERY_STARTED -> {
                                    isScanning = true
                                }
                                BluetoothAdapter.ACTION_DISCOVERY_FINISHED -> {
                                    isScanning = false
                                }
                            }
                        }
                    }

                    val filter = IntentFilter().apply {
                        addAction(BluetoothDevice.ACTION_FOUND)
                        addAction(BluetoothAdapter.ACTION_DISCOVERY_STARTED)
                        addAction(BluetoothAdapter.ACTION_DISCOVERY_FINISHED)
                    }

                    ContextCompat.registerReceiver(
                        context,
                        receiver,
                        filter,
                        ContextCompat.RECEIVER_EXPORTED
                    )

                    refreshBluetoothDevices()

                    try {
                        if (!bluetoothAdapter.isDiscovering) {
                            isScanning = bluetoothAdapter.startDiscovery()
                        }
                    } catch (_: SecurityException) {
                        isScanning = false
                    }

                    onDispose {
                        try { bluetoothAdapter.cancelDiscovery() } catch (_: Exception) {}
                        try { context.unregisterReceiver(receiver) } catch (_: Exception) {}
                    }
                }
            }

            SetupStepCard(
                stepNumber = 4,
                title = "Bluetooth Devices",
                description = when {
                    !bluetoothPermissionGranted ->
                        "Grant Nearby devices permission so the app can scan Bluetooth devices."
                    bluetoothAdapter == null ->
                        "This phone does not expose a Bluetooth adapter."
                    selectedDeviceName != null ->
                        "Selected: " + selectedDeviceName
                    discoveredDevices.isEmpty() ->
                        if (isScanning) "Scanning nearby Bluetooth devices…" else "No paired devices found."
                    else ->
                        "Select a paired or discovered device. HFP/SCO routing is used after selection."
                },
                isComplete = selectedDeviceName != null,
                actionLabel = when {
                    !bluetoothPermissionGranted -> "Grant Nearby devices"
                    isScanning -> null
                    else -> "Scan again"
                },
                onAction = {
                    if (!bluetoothPermissionGranted) {
                        btPermissionLauncher.launch(
                            if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                                arrayOf(
                                    Manifest.permission.BLUETOOTH_SCAN,
                                    Manifest.permission.BLUETOOTH_CONNECT
                                )
                            } else {
                                arrayOf(Manifest.permission.BLUETOOTH)
                            }
                        )
                    } else {
                        try {
                            bluetoothAdapter?.cancelDiscovery()
                            refreshBluetoothDevices()
                            isScanning = bluetoothAdapter?.startDiscovery() == true
                        } catch (_: Exception) {
                            isScanning = false
                        }
                    }
                },
            )

            if (discoveredDevices.isNotEmpty()) {
                Card(
                    modifier = Modifier.fillMaxWidth(),
                    shape = RoundedCornerShape(16.dp),
                    colors = CardDefaults.cardColors(containerColor = SurfaceCard),
                ) {
                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .padding(14.dp),
                        verticalArrangement = Arrangement.spacedBy(8.dp),
                    ) {
                        Text(
                            "Found / paired devices",
                            style = MaterialTheme.typography.titleSmall,
                            color = MaterialTheme.colorScheme.onSurface,
                        )
                        discoveredDevices.forEach { device ->
                            val name = try {
                                device.name ?: "Unnamed Bluetooth device"
                            } catch (_: SecurityException) {
                                "Bluetooth device"
                            }

                            OutlinedButton(
                                onClick = {
                                    selectedDeviceName = name
                                    try { bluetoothAdapter?.cancelDiscovery() } catch (_: Exception) {}
                                    audioRoutingManager.routeToFirstAvailableBluetooth()
                                },
                                modifier = Modifier.fillMaxWidth(),
                            ) {
                                Text(name)
                            }
                        }
                    }
                }
            }

          '''
          text = text[:start] + replacement + text[end:]
          setup.write_text(text)
          print("FINAL BLUETOOTH PATCH APPLIED")
          PY

      - name: Remove CDM-only device setup requirement
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/AndroidManifest.xml"
          s = p.read_text()
          s = re.sub(
              r'\s*<uses-feature\s+android:name="android\.software\.companion_device_setup"\s+android:required="true"\s*/>',
              '',
              s
          )
          p.write_text(s)
          PY

      - name: Final source fixes
        run: |
          set -e
          sed -i '/hfpMusicPlayer = hfpMusicPlayer,/d' "$PROJECT_DIR/app/src/main/java/com/btmicfix/MainActivity.kt"
          perl -0pi -e 's/(HomeScreen\(\s*audioRoutingManager = audioRoutingManager,)/$1\n                            hfpMusicPlayer = hfpMusicPlayer,/s' "$PROJECT_DIR/app/src/main/java/com/btmicfix/MainActivity.kt"
          sed -i 's/(outputDevices.asList() + commDevices.asList())/(outputDevices.toList() + commDevices)/' "$PROJECT_DIR/app/src/main/java/com/btmicfix/audio/AudioRoutingManager.kt"
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and upload APK
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app" -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HFP-MusicPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HFP-MusicPlayer-APK
          path: HFP-MusicPlayer.apk
          if-no-files-found: error
