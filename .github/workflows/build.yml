name: Build HFP Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir extracted
          unzip -q BTMicFix-HFP-MusicPlayer.zip -d extracted

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/extracted" -name settings.gradle.kts -o -name settings.gradle | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/btmicfix/MainActivity.kt"
          s = p.read_text()
          old = """                        SetupScreen(
                            audioRoutingManager = audioRoutingManager,
                            hfpMusicPlayer = hfpMusicPlayer,
                            shizukuManager = shizukuManager,"""
          new = """                        SetupScreen(
                            audioRoutingManager = audioRoutingManager,
                            shizukuManager = shizukuManager,"""
          if old not in s:
              raise SystemExit("Expected SetupScreen block was not found")
          p.write_text(s.replace(old, new, 1))
          PY
          echo "=== Patched SetupScreen call ==="
          nl -ba "$PROJECT_DIR/app/src/main/java/com/btmicfix/MainActivity.kt" | sed -n '72,92p'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HFP-MusicPlayer-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
