name: Build HFP Music Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          mkdir -p extracted
          unzip -q BTMicFix-HFP-MusicPlayer.zip -d extracted
          SETTINGS=$(find "$GITHUB_WORKSPACE/extracted" -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Patch Bluetooth HFP support
        run: |
          echo '' | base64 -d | python3

      - name: Final source fixes
        run: |
          set -e
          # The current project ZIP expects the HFP player parameter in SetupScreen.
          sed -i '/audioRoutingManager = audioRoutingManager,/a\                            hfpMusicPlayer = hfpMusicPlayer,' "$PROJECT_DIR/app/src/main/java/com/btmicfix/MainActivity.kt"
          sed -i 's/(outputDevices.asList() + commDevices.asList())/(outputDevices.toList() + commDevices)/' "$PROJECT_DIR/app/src/main/java/com/btmicfix/audio/AudioRoutingManager.kt"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and upload APK
        run: |
          set -e
          APK=$(find "$PROJECT_DIR/app" -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" HFP-MusicPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HFP-MusicPlayer-APK
          path: HFP-MusicPlayer.apk
          if-no-files-found: error
